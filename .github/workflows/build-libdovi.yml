name: Build mpv-android with libdovi

on:
  workflow_dispatch: {}
  push:
    branches: [libdovi]
    paths:
      - 'buildscripts/**'
      - '.github/workflows/build-libdovi.yml'

env:
  IN_CI: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armv7l, x86_64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf pkg-config libtool ninja-build python3-pip \
            nasm zip wget git curl build-essential gettext

      - name: Install meson
        run: |
          sudo pip3 install meson==1.5.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install cargo-c
        run: |
          cargo install cargo-c --locked

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi \
                            x86_64-linux-android i686-linux-android

      - name: Download mpv-android deps + Android SDK/NDK
        working-directory: buildscripts
        run: ./download.sh

      - name: Build mpv (target=${{ matrix.arch }})
        working-directory: buildscripts
        run: |
          ./buildall.sh --arch ${{ matrix.arch }} mpv

      - name: Inspect libmpv for libdovi + libplacebo symbols
        working-directory: buildscripts
        run: |
          # Track the produced libmpv.so under the per-arch prefix dir.
          prefix=$(find . -path '*prefix*/lib/libmpv.so' -print -quit || true)
          echo "libmpv at: $prefix"
          if [ -n "$prefix" ]; then
            echo '── DV-related symbols ──'
            nm -D --defined-only "$prefix" 2>/dev/null | grep -iE 'dovi|reshape' || true
            echo '── libplacebo tone-map symbols ──'
            nm -D --defined-only "$prefix" 2>/dev/null | grep -iE 'pl_tone_map|pl_shader_dovi' || true
            ls -la "$(dirname "$prefix")"
          fi

      - name: Collect native libs
        run: |
          mkdir -p artifact/${{ matrix.arch }}
          # Find the merged jni_libs folder that mpv-android produces.
          find buildscripts -path '*prefix*/lib/*.so' -exec cp -v {} artifact/${{ matrix.arch }}/ \;
          ls -la artifact/${{ matrix.arch }}/

      - name: Upload per-ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: artifact/${{ matrix.arch }}/
          retention-days: 30

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all per-ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: native/

      - name: Show layout
        run: find native -type f | head -60

      - name: Zip per ABI for distribution
        run: |
          mkdir -p dist
          for arch_dir in native/native-*; do
            arch=${arch_dir##*native-}
            # Map our naming to Android ABI names.
            case "$arch" in
              arm64)  abi=arm64-v8a ;;
              armv7l) abi=armeabi-v7a ;;
              x86_64) abi=x86_64 ;;
              x86)    abi=x86 ;;
              *)      abi="$arch" ;;
            esac
            ( cd "$arch_dir" && zip -r "../../dist/${abi}.zip" . )
          done
          ls -la dist/

      - name: Tag with timestamp
        id: tag
        run: echo "tag=libdovi-$(date -u +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: mpv-android + libdovi — ${{ steps.tag.outputs.tag }}
          body: |
            Built from mpv-android with libdovi statically linked into libplacebo + ffmpeg.

            Each `<abi>.zip` contains the per-ABI native `.so` files for use
            inside an Android AAR. Repackage into `jni/<abi>/` to consume.

            Verify libdovi presence:
            ```
            nm -D libmpv.so | grep -iE 'dovi|reshape'
            ```
          files: dist/*.zip
          prerelease: true
